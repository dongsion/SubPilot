<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="r7bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/><stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <radialGradient id="r7coin" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#fff0c8"/>
      <stop offset="30%" stop-color="#f0d090"/>
      <stop offset="65%" stop-color="#c4a050"/>
      <stop offset="100%" stop-color="#806020"/>
    </radialGradient>
    <radialGradient id="r7face" cx="40%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#f5e0a8"/>
      <stop offset="100%" stop-color="#c0a050"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#r7bg)"/>
  <ellipse cx="256" cy="418" rx="125" ry="11" fill="#000" opacity="0.4"/>
  <!-- Large coin with thicker rim -->
  <circle cx="256" cy="252" r="162" fill="url(#r7coin)"/>
  <!-- Thick outer rim with 3D bevel -->
  <circle cx="256" cy="252" r="162" fill="none" stroke="#806020" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="250" r="160" fill="none" stroke="#fff0c8" stroke-width="1" opacity="0.25"/>
  <circle cx="256" cy="254" r="158" fill="none" stroke="#5a4010" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner face (smaller, deeper set) -->
  <circle cx="256" cy="252" r="118" fill="url(#r7face)"/>
  <circle cx="256" cy="252" r="118" fill="none" stroke="#806020" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="252" r="105" fill="none" stroke="#806020" stroke-width="0.5" opacity="0.1"/>
  <!-- C (large, bold) -->
  <path d="M 318 165 A 92 92 0 1 0 318 339 L 318 307 A 60 60 0 1 1 318 197 Z" fill="#1a1208"/>
  <text x="256" y="278" font-family="-apple-system,sans-serif" font-size="50" font-weight="800" fill="#fff0c8" text-anchor="middle">¥</text>
  <!-- Strong rim highlight -->
  <path d="M 130 200 A 162 162 0 0 1 384 200" fill="none" stroke="#fff" stroke-width="3" opacity="0.15" stroke-linecap="round"/>
  <!-- Face highlight -->
  <ellipse cx="210" cy="165" rx="50" ry="15" fill="#fff" opacity="0.08" transform="rotate(-25 210 165)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g13bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1510"/><stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <linearGradient id="g13g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/><stop offset="100%" stop-color="#b8893e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g13bg)"/>
  <!-- Vintage ledger book -->
  <!-- Book spine -->
  <rect x="136" y="120" width="240" height="272" rx="4" fill="#2a2218" stroke="url(#g13g)" stroke-width="2"/>
  <!-- Book pages -->
  <rect x="144" y="128" width="224" height="256" rx="2" fill="#1a1510"/>
  <!-- Center fold line -->
  <line x1="256" y1="128" x2="256" y2="384" stroke="url(#g13g)" stroke-width="1" opacity="0.2"/>
  <!-- Ledger lines -->
  <line x1="160" y1="160" x2="352" y2="160" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="185" x2="352" y2="185" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="210" x2="352" y2="210" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="235" x2="352" y2="235" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="260" x2="352" y2="260" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="285" x2="352" y2="285" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="310" x2="352" y2="310" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="335" x2="352" y2="335" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <line x1="160" y1="360" x2="352" y2="360" stroke="url(#g13g)" stroke-width="1" opacity="0.15"/>
  <!-- Handwritten amounts -->
  <text x="170" y="155" font-family="cursive" font-size="16" fill="url(#g13g)" opacity="0.7">支出 ¥35</text>
  <text x="170" y="180" font-family="cursive" font-size="16" fill="url(#g13g)" opacity="0.5">收入 ¥8000</text>
  <text x="170" y="205" font-family="cursive" font-size="16" fill="url(#g13g)" opacity="0.5">支出 ¥12</text>
  <text x="170" y="230" font-family="cursive" font-size="16" fill="url(#g13g)" opacity="0.4">支出 ¥68</text>
  <text x="170" y="255" font-family="cursive" font-size="16" fill="url(#g13g)" opacity="0.4">支出 ¥9.9</text>
  <!-- Big C stamp -->
  <circle cx="290" cy="310" r="42" fill="none" stroke="url(#g13g)" stroke-width="3" opacity="0.8"/>
  <text x="290" y="325" font-family="serif" font-size="52" font-weight="700" fill="url(#g13g)" text-anchor="middle" opacity="0.8">C</text>
  <!-- Bookmark ribbon -->
  <polygon points="310,120 340,120 340,165 325,150 310,165" fill="url(#g13g)" opacity="0.6"/>
</svg>

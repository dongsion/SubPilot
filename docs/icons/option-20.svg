<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g20bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="g20g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/><stop offset="50%" stop-color="#d4af7a"/><stop offset="100%" stop-color="#9a7030"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g20bg)"/>
  <!-- Geometric tessellation C (Islamic pattern style) -->
  <!-- Large C outline -->
  <path d="M 350 130 A 140 140 0 1 0 350 382 L 350 340 A 98 98 0 1 1 350 172 Z"
        fill="url(#g20g)" opacity="0.9"/>
  <!-- Pattern overlay: triangles -->
  <g fill="#0a0a0a" opacity="0.15">
    <polygon points="256,160 280,200 232,200"/>
    <polygon points="256,200 280,240 232,240"/>
    <polygon points="256,240 280,280 232,280"/>
    <polygon points="256,280 280,320 232,320"/>
    <polygon points="256,320 280,360 232,360"/>
    <polygon points="200,200 224,240 176,240"/>
    <polygon points="200,280 224,320 176,320"/>
    <polygon points="312,200 336,240 288,240"/>
    <polygon points="312,280 336,320 288,320"/>
  </g>
  <!-- Diamond pattern -->
  <g fill="none" stroke="#0a0a0a" stroke-width="1" opacity="0.2">
    <polygon points="256,150 280,180 256,210 232,180"/>
    <polygon points="256,310 280,340 256,370 232,340"/>
    <polygon points="170,220 194,250 170,280 146,250"/>
    <polygon points="342,220 366,250 342,280 318,250"/>
  </g>
  <!-- Center ¥ in negative space -->
  <text x="256" y="268" font-family="-apple-system,sans-serif" font-size="44" font-weight="800" fill="url(#g20g)" text-anchor="middle">¥</text>
  <!-- Outer decorative dots -->
  <g fill="url(#g20g)" opacity="0.3">
    <circle cx="256" cy="90" r="3"/>
    <circle cx="256" cy="422" r="3"/>
    <circle cx="90" cy="256" r="3"/>
    <circle cx="422" cy="256" r="3"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="r2bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d0d12"/><stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="r2coin" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fce8b8"/>
      <stop offset="35%" stop-color="#e8c886"/>
      <stop offset="70%" stop-color="#c4a050"/>
      <stop offset="100%" stop-color="#9a7820"/>
    </radialGradient>
    <linearGradient id="r2inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d898"/>
      <stop offset="100%" stop-color="#c4a050"/>
    </linearGradient>
    <filter id="r2glow"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#r2bg)"/>
  <!-- Soft glow behind coin -->
  <circle cx="256" cy="256" r="160" fill="#d4af7a" opacity="0.05" filter="url(#r2glow)"/>
  <!-- Outer rim (thicker, more pronounced) -->
  <circle cx="256" cy="256" r="152" fill="url(#r2coin)"/>
  <!-- Decorative rim notches (coin edge) -->
  <g stroke="#8a6020" stroke-width="1.5" opacity="0.3">
    <line x1="256" y1="104" x2="256" y2="116"/>
    <line x1="256" y1="396" x2="256" y2="408"/>
    <line x1="104" y1="256" x2="116" y2="256"/>
    <line x1="396" y1="256" x2="408" y2="256"/>
    <line x1="148" y1="148" x2="156" y2="156"/>
    <line x1="356" y1="356" x2="364" y2="364"/>
    <line x1="148" y1="364" x2="156" y2="356"/>
    <line x1="356" y1="156" x2="364" y2="148"/>
  </g>
  <!-- Double groove -->
  <circle cx="256" cy="256" r="138" fill="none" stroke="#8a6020" stroke-width="1" opacity="0.4"/>
  <circle cx="256" cy="256" r="132" fill="none" stroke="#8a6020" stroke-width="1" opacity="0.2"/>
  <!-- Inner face -->
  <circle cx="256" cy="256" r="120" fill="url(#r2inner)"/>
  <!-- Inner decorative ring -->
  <circle cx="256" cy="256" r="105" fill="none" stroke="#8a6020" stroke-width="0.8" opacity="0.2"/>
  <!-- C letter (deep embossed) -->
  <path d="M 325 175 A 90 90 0 1 0 325 337 L 325 305 A 58 58 0 1 1 325 207 Z" fill="#1a1510"/>
  <!-- C inner highlight -->
  <path d="M 325 175 A 90 90 0 1 0 325 337 L 325 305 A 58 58 0 1 1 325 207 Z" fill="none" stroke="#9a7820" stroke-width="1.5" opacity="0.4"/>
  <!-- ¥ symbol (light gold, glowing) -->
  <text x="256" y="282" font-family="-apple-system,sans-serif" font-size="54" font-weight="800" fill="#fce8b8" text-anchor="middle" filter="url(#r2glow)">¥</text>
  <text x="256" y="282" font-family="-apple-system,sans-serif" font-size="54" font-weight="800" fill="#fff5d6" text-anchor="middle">¥</text>
  <!-- Strong specular highlight -->
  <ellipse cx="200" cy="165" rx="55" ry="18" fill="#fff" opacity="0.12" transform="rotate(-25 200 165)"/>
  <!-- Bottom shadow on coin -->
  <ellipse cx="256" cy="370" rx="90" ry="12" fill="#8a6020" opacity="0.2"/>
  <!-- Ground shadow -->
  <ellipse cx="256" cy="420" rx="120" ry="10" fill="#000" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g18bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="g18g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/><stop offset="50%" stop-color="#d4af7a"/><stop offset="100%" stop-color="#9a7030"/>
    </linearGradient>
    <linearGradient id="g18sh" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af7a"/><stop offset="100%" stop-color="#6a5020"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g18bg)"/>
  <!-- 3D glossy coin button -->
  <!-- Outer ring (dark edge) -->
  <circle cx="256" cy="256" r="150" fill="url(#g18sh)"/>
  <!-- Inner face -->
  <circle cx="256" cy="250" r="140" fill="url(#g18g)"/>
  <!-- Top highlight -->
  <ellipse cx="256" cy="180" rx="100" ry="40" fill="#fff" opacity="0.15"/>
  <!-- Bottom shadow -->
  <ellipse cx="256" cy="330" rx="120" ry="30" fill="#9a7030" opacity="0.3"/>
  <!-- Inner ring -->
  <circle cx="256" cy="250" r="110" fill="none" stroke="#9a7030" stroke-width="2" opacity="0.4"/>
  <!-- C embossed -->
  <path d="M 300 180 A 75 75 0 1 0 300 320 L 300 295 A 50 50 0 1 1 300 205 Z"
        fill="url(#g18bg)" opacity="0.85"/>
  <!-- C highlight -->
  <path d="M 300 180 A 75 75 0 1 0 300 320 L 300 295 A 50 50 0 1 1 300 205 Z"
        fill="none" stroke="#f5d99b" stroke-width="1" opacity="0.5"/>
  <!-- ¥ small -->
  <text x="256" y="270" font-family="-apple-system,sans-serif" font-size="44" font-weight="800" fill="url(#g18g)" text-anchor="middle" opacity="0.9">¥</text>
  <!-- Glossy reflection arc -->
  <path d="M 150 200 Q 256 140 362 200" fill="none" stroke="#fff" stroke-width="3" opacity="0.2" stroke-linecap="round"/>
  <!-- Shadow under coin -->
  <ellipse cx="256" cy="420" rx="110" ry="12" fill="#000" opacity="0.4"/>
</svg>

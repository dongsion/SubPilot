<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g9bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="g9gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/>
      <stop offset="50%" stop-color="#d4af7a"/>
      <stop offset="100%" stop-color="#b8893e"/>
    </linearGradient>
    <linearGradient id="g9goldBright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/>
      <stop offset="100%" stop-color="#d4af7a"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#g9bg)"/>

  <!-- Bold C as a thick crescent (like a crescent moon / coin edge) -->
  <!-- This is a thick ring with a gap on the right -->
  <path d="M 340 120
           A 150 150 0 1 0 340 392
           L 340 345
           A 103 103 0 1 1 340 167
           Z"
        fill="url(#g9gold)"/>

  <!-- Lightning bolt cut through the C (speed = 快) -->
  <polygon points="275,140 230,260 265,260 220,372 310,230 275,230 320,140"
           fill="url(#g9bg)"/>

  <!-- Inner glow on bolt edges -->
  <polygon points="275,140 230,260 265,260 220,372 310,230 275,230 320,140"
           fill="none" stroke="url(#g9goldBright)" stroke-width="1.5" opacity="0.4"/>

  <!-- Small ¥ at bottom -->
  <text x="256" y="430" font-family="-apple-system,sans-serif" font-size="28" font-weight="700" fill="url(#g9gold)" text-anchor="middle" opacity="0.5">¥</text>
</svg>

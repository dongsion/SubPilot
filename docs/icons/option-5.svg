<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g5bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="g5gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/>
      <stop offset="50%" stop-color="#d4af7a"/>
      <stop offset="100%" stop-color="#b8893e"/>
    </linearGradient>
    <linearGradient id="g5goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/>
      <stop offset="100%" stop-color="#d4af7a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#g5bg)"/>

  <!-- Stylized C as a bold geometric shape (half circle / bracket) -->
  <!-- Outer arc -->
  <path d="M 370 130
           A 130 130 0 1 0 370 382
           L 370 340
           A 88 88 0 1 1 370 172
           Z"
        fill="url(#g5gold)"/>

  <!-- Inner cutout creates the C shape -->
  <!-- ¥ symbol inside -->
  <text x="256" y="295" font-family="-apple-system,sans-serif" font-size="100" font-weight="800" fill="url(#g5bg)" text-anchor="middle">¥</text>

  <!-- Small upward arrow above ¥ -->
  <path d="M 256 170 L 240 190 L 252 190 L 252 205 L 260 205 L 260 190 L 272 190 Z" fill="url(#g5goldLight)" opacity="0.9"/>

  <!-- Bottom subtle line -->
  <rect x="200" y="400" width="112" height="3" rx="1.5" fill="url(#g5gold)" opacity="0.3"/>
</svg>

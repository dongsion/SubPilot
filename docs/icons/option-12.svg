  <circle cx="155" cy="335" r="4" fill="url(#g12g)" opacity="0.4"/>
  <circle cx="175" cy="335" r="4" fill="url(#g12g)" opacity="0.4"/>
  <rect x="330" y="328" width="50" height="14" rx="7" fill="url(#g12g)" opacity="0.3"/>

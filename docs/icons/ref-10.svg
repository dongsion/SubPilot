    <line x1="406" y1="272" x2="398" y2="270"/>
    <line x1="400" y1="312" x2="392" y2="308"/>
    <line x1="384" y1="348" x2="376" y2="342"/>
    <line x1="360" y1="378" x2="352" y2="370"/>
    <line x1="330" y1="400" x2="324" y2="390"/>
    <line x1="294" y1="414" x2="290" y2="404"/>
    <line x1="256" y1="416" x2="256" y2="406"/>
    <line x1="218" y1="414" x2="222" y2="404"/>
    <line x1="182" y1="400" x2="188" y2="390"/>
    <line x1="152" y1="378" x2="160" y2="370"/>
    <line x1="128" y1="348" x2="136" y2="342"/>
    <line x1="112" y1="312" x2="120" y2="308"/>
    <line x1="106" y1="272" x2="114" y2="270"/>
    <line x1="108" y1="232" x2="116" y2="234"/>
    <line x1="118" y1="194" x2="126" y2="198"/>
    <line x1="136" y1="160" x2="144" y2="166"/>
    <line x1="160" y1="132" x2="166" y2="140"/>
    <line x1="190" y1="112" x2="194" y2="122"/>

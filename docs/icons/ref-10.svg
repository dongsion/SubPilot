  <!-- ¥ (bright gold) -->
  <text x="256" y="278" font-family="-apple-system,sans-serif" font-size="54" font-weight="800" fill="#fff5d6" text-anchor="middle">¥</text>
  <!-- Specular highlights -->
  <ellipse cx="190" cy="145" rx="65" ry="20" fill="#fff" opacity="0.1" transform="rotate(-30 190 145)"/>
  <circle cx="170" cy="130" r="10" fill="#fff" opacity="0.06"/>
</svg>

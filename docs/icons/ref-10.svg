  <!-- Double groove -->
  <circle cx="256" cy="252" r="145" fill="none" stroke="#5a3810" stroke-width="1" opacity="0.3"/>
  <circle cx="256" cy="252" r="140" fill="none" stroke="#fce8b8" stroke-width="0.5" opacity="0.1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="r10bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0d0a06"/><stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="r10coin" cx="33%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#fff5d6"/>
      <stop offset="15%" stop-color="#fce8b8"/>
      <stop offset="40%" stop-color="#e8c886"/>
      <stop offset="65%" stop-color="#c4a050"/>
      <stop offset="88%" stop-color="#9a7030"/>
      <stop offset="100%" stop-color="#5a3810"/>
    </radialGradient>
    <radialGradient id="r10face" cx="38%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f5e0a8"/>
      <stop offset="50%" stop-color="#d4af7a"/>
      <stop offset="100%" stop-color="#9a7030"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#r10bg)"/>
  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="175" fill="#d4af7a" opacity="0.03"/>

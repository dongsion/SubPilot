  <!-- C with 3D layers -->
  <path d="M 330 160 A 96 96 0 1 0 330 344 L 330 310 A 62 62 0 1 1 330 194 Z" fill="#3a2a10" opacity="0.3" transform="translate(2,3)"/>
  <path d="M 330 160 A 96 96 0 1 0 330 344 L 330 310 A 62 62 0 1 1 330 194 Z" fill="#1a1208"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="g3bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1a1510"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="g3gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/>
      <stop offset="35%" stop-color="#d4af7a"/>
      <stop offset="70%" stop-color="#b8893e"/>
      <stop offset="100%" stop-color="#9a7030"/>
    </linearGradient>
    <linearGradient id="g3coin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/>
      <stop offset="50%" stop-color="#d4af7a"/>
      <stop offset="100%" stop-color="#b8893e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#g3bg)"/>
  <!-- Coin stack - 3 coins with perspective -->
  <!-- Bottom coin -->
  <ellipse cx="256" cy="370" rx="130" ry="34" fill="url(#g3coin)"/>
  <rect x="126" y="340" width="260" height="30" fill="url(#g3coin)"/>
  <ellipse cx="256" cy="340" rx="130" ry="34" fill="#9a7030"/>
  <!-- Middle coin -->
  <ellipse cx="256" cy="305" rx="130" ry="34" fill="url(#g3coin)"/>
  <rect x="126" y="275" width="260" height="30" fill="url(#g3coin)"/>
  <ellipse cx="256" cy="275" rx="130" ry="34" fill="#b8893e"/>
  <!-- Top coin face -->
  <ellipse cx="256" cy="240" rx="130" ry="34" fill="url(#g3coin)"/>
  <rect x="126" y="210" width="260" height="30" fill="url(#g3coin)"/>
  <ellipse cx="256" cy="210" rx="130" ry="34" fill="url(#g3coin)"/>
  <!-- Inner ring on top coin -->
  <ellipse cx="256" cy="210" rx="100" ry="26" fill="none" stroke="#9a7030" stroke-width="2" opacity="0.4"/>
  <!-- C letter on top coin -->
  <path d="M 300 210
           A 50 50 0 1 0 300 210
           M 285 180
           A 35 35 0 1 1 285 240"
        fill="none"
        stroke="#1a1510"
        stroke-width="12"
        stroke-linecap="round"/>
  <!-- Shine on top coin -->
  <ellipse cx="210" cy="195" rx="40" ry="8" fill="#fff" opacity="0.15"/>
  <!-- Sparkle -->
  <circle cx="380" cy="150" r="4" fill="#f5d99b" opacity="0.7"/>
  <circle cx="140" cy="140" r="3" fill="#f5d99b" opacity="0.5"/>
</svg>

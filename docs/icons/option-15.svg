<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g15bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <linearGradient id="g15g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/><stop offset="100%" stop-color="#b8893e"/>
    </linearGradient>
    <linearGradient id="g15g2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d99b"/><stop offset="100%" stop-color="#9a7030"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g15bg)"/>
  <!-- Origami crane holding a coin -->
  <!-- Left wing -->
  <polygon points="256,200 100,280 200,260" fill="url(#g15g)" opacity="0.9"/>
  <!-- Right wing -->
  <polygon points="256,200 412,280 312,260" fill="url(#g15g2)" opacity="0.8"/>
  <!-- Body -->
  <polygon points="256,200 220,260 256,320 292,260" fill="url(#g15g)"/>
  <!-- Head/beak -->
  <polygon points="256,200 256,170 276,185" fill="url(#g15g2)"/>
  <!-- Tail -->
  <polygon points="256,320 236,360 276,360" fill="url(#g15g2)" opacity="0.7"/>
  <!-- Fold lines -->
  <line x1="256" y1="200" x2="200" y2="260" stroke="#9a7030" stroke-width="1" opacity="0.3"/>
  <line x1="256" y1="200" x2="312" y2="260" stroke="#9a7030" stroke-width="1" opacity="0.3"/>
  <line x1="256" y1="200" x2="256" y2="320" stroke="#9a7030" stroke-width="1" opacity="0.3"/>
  <line x1="220" y1="260" x2="292" y2="260" stroke="#9a7030" stroke-width="1" opacity="0.3"/>
  <!-- Coin in center of body -->
  <circle cx="256" cy="270" r="22" fill="url(#g15g)"/>
  <text x="256" y="278" font-family="-apple-system,sans-serif" font-size="22" font-weight="800" fill="#0a0a0a" text-anchor="middle">¥</text>
  <!-- Shadow -->
  <ellipse cx="256" cy="390" rx="80" ry="5" fill="url(#g15g)" opacity="0.05"/>
</svg>
